{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'catalog/style.css' %}" />
</head>
<body>
    <div class="login-page">
        <form method="post" class="login-form">
            {% csrf_token %}
            <h1>Login</h1>
            {% if form.errors %}
                <p class="error">Please enter correct credentials.</p>
            {% endif %}
            <div class="form-row">{{ form.username.label_tag }}{{ form.username }}</div>
            <div class="form-row">{{ form.password.label_tag }}{{ form.password }}</div>
            <button type="submit" class="primary-button">Log in</button>
            <input type="hidden" name="next" value="{{ next }}" />
            <p class="login-footer">Don't have an account? <a href="{% url 'register' %}">Register</a></p>
        </form>
    </div>
</body>
</html>
