{% load static %}
<div class="audio-player custom-player" data-preview="{{ preview|default_if_none:False|yesno:'true,false' }}">
    <div class="player-top-row">
        <div class="controls-row">
            <button type="button" class="player-btn" data-action="start" aria-label="Start">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 4l12 8-12 8V4zm12 0h2v16h-2V4z"/></svg>
            </button>
            <button type="button" class="player-btn seek-icon" data-action="seek-back" aria-label="Seek back 10 seconds">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M11 19V5l-7 7 7 7zm7 0V5l-7 7 7 7z"/></svg>
            </button>
            <button type="button" class="player-btn play-toggle" data-action="toggle" aria-label="Play/Pause">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 5v14l11-7L8 5z"/></svg>
            </button>
            <button type="button" class="player-btn seek-icon" data-action="seek-forward" aria-label="Seek forward 10 seconds">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 5v14l7-7-7-7zm7 0v14l7-7-7-7z"/></svg>
            </button>
            <button type="button" class="player-btn" data-action="end" aria-label="End">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 4h2v16H4V4zm4 8l12 8V4L8 12z"/></svg>
            </button>
        </div>
        <div class="player-progress-row">
            <div class="timecodes">
                <span class="time current-time">0:00</span>
                <span class="time duration-time">0:00</span>
            </div>
            <input type="range" class="progress-bar" min="0" max="100" value="0" step="0.1" />
        </div>
    </div>
    {% if preview %}
        <div class="player-preview-note">Preview only — 60 seconds</div>
    {% endif %}
    <div class="player-meta-row">
        <label class="volume-control">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 9v6h4l5 5V4l-5 5H5z"/></svg>
            <input type="range" class="volume-slider" min="0" max="1" step="0.05" value="1" />
        </label>
        <div class="speed-btn-container">
            <button type="button" class="speed-btn" aria-label="Playback speed">1×</button>
            <div class="speed-overlay" aria-hidden="true">
                <button type="button" class="speed-option" data-speed="0.75">0.75×</button>
                <button type="button" class="speed-option" data-speed="1">1×</button>
                <button type="button" class="speed-option" data-speed="1.25">1.25×</button>
                <button type="button" class="speed-option" data-speed="1.5">1.5×</button>
                <button type="button" class="speed-option" data-speed="2">2×</button>
            </div>
        </div>
    </div>
    <audio preload="metadata" controlsList="nodownload" data-src="{{ audio_url }}"></audio>
</div>
