<div class="cart-widget">
    <button type="button" class="cart-toggle-button" aria-label="Open cart">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zm10 0c-1.1 0-1.99.9-1.99 2S15.9 22 17 22s-2-.9-2-2-.9-2-2-2zM7.16 14.26l.94-4.1h8.68l1.2-5H6.21L5.27 2H2v2h2.79l3.6 14H19v-2H7.16z"/></svg>
        <span class="cart-badge">{{ cart_count }}</span>
    </button>
    <div class="cart-panel">
        <div class="cart-panel-header">
            <h3>Your cart</h3>
            <button type="button" class="cart-close-button" aria-label="Close cart">×</button>
        </div>
        {% if cart_items %}
            <ul class="cart-list">
                {% for item in cart_items %}
                    <li class="cart-item">
                        <span>{{ item.name }}</span>
                        <form method="post" action="{% url 'cart_remove' item.id %}">
                            {% csrf_token %}
                            <button type="submit" class="remove-button" aria-label="Remove {{ item.name }}">×</button>
                        </form>
                    </li>
                {% endfor %}
            </ul>
            <a href="{% url 'checkout' %}" class="primary-button">Checkout</a>
        {% else %}
            <p class="cart-empty">Your cart is empty.</p>
        {% endif %}
    </div>
</div>
